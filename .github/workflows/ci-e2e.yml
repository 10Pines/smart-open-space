name: E2E CI

permissions:
  contents: read

on: push

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Use Java 21
      uses: actions/setup-java@v6.1.0
      with:
        java-version: 21
        distribution: corretto
        architecture: x64
    - name: Use Node 24
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Make Gradle executable
      run: chmod +x ../back/gradlew
    - name: Cache Gradle packages
      uses: actions/cache@v6
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
        restore-keys: ${{ runner.os }}-gradle
    - name: Install dependencies
      run: npm ci
    - name: Resolve Playwright version
      id: playwright
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
    - name: Install Playwright browser and system dependencies
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
    - name: Run E2E tests (starts back with H2 and front automatically)
      run: npm run test:e2e
      env:
        CI: true
    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          front/playwright-report/
          front/test-results/
        retention-days: 7

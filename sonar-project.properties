# Un único proyecto de Sonar para todo el repo (backend + frontend).
sonar.projectKey=10Pines_smart-open-space_bc3c48a8-fa5d-4258-9950-a6c5a57efd77
sonar.projectName=smart-open-space
sonar.host.url=https://sonar.10pines.com

sonar.sources=back/src/main/kotlin,front/src
sonar.exclusions=front/src/__tests__/**,front/src/setupTests.js,front/src/assets/**
sonar.tests=back/src/test/kotlin,front/src/__tests__

# Backend
sonar.java.binaries=back/build/classes
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml

# Frontend
sonar.javascript.lcov.reportPaths=front/coverage/lcov.info
